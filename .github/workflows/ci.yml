name: CI

on:
  push:
    branches:
      - main
    paths:
    - 'charbot/**'
    - 'tests/**'
    - 'src/**'
    - 'Cargo.*'
    - 'pyproject.toml'
    - '.github/workflows/**'
    - 'uv.lock'
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
    - 'charbot/**'
    - 'tests/**'
    - 'src/**'
    - 'Cargo.*'
    - 'pyproject.toml'
    - '.github/workflows/**'
    - 'uv.lock'

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Dependencies
        run: |
          pip install ruff -c ruff-requirements.txt
      - name: Run Ruff Check
        env:
          RUFF_OUTPUT_FORMAT: github
        run: ruff check .
      - name: Run Ruff Format
        if: ${{ success() || failure()}}
        run: ruff format --check .
  python-tests:
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13", "3.14", "3.15" ]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ikalnytskyi/action-setup-postgres@v9
        with:
          postgres-version: '18'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run pytest
        id: pytest
        run: pytest
      - name: Run Pyright
        if: ${{ success() || failure() }}
        uses: jakebailey/pyright-action@v3.0.2
        with:
          warnings: false
          annotate: ${{ matrix.python-version != '3.13' && 'none' || 'all' }}
          version: 1.1.400 # Optional
  verify-lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
